name: streetrun
description: "StreetRun — приложение для бега/ходьбы по городу с GPS-треком, чекпоинтами и друзьями."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # Карты и GPS
  flutter_map: ^6.0.0
  geolocator: ^10.0.0
  latlong2: ^0.9.0

  # Локальное хранилище
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # Голос
  flutter_tts: ^3.8.3

  # Загрузка изображений
  image_picker: ^1.0.4
  http: ^1.1.0

  # Управление состоянием
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Навигация
  go_router: ^13.0.0

  # Вспомогательное
  intl: ^0.18.1
  connectivity_plus: ^7.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # assets:
  #   - assets/icons/
